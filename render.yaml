services:
  - type: web
    name: openclaw
    runtime: docker
    region: frankfurt
    plan: standard
    healthCheckPath: /health
    dockerCommand: sh -c "node openclaw.mjs config set gateway.controlUi.dangerouslyAllowHostHeaderOriginFallback true && node openclaw.mjs gateway --allow-unconfigured --bind lan --port 8080"
    envVars:
      - key: OPENCLAW_GATEWAY_PORT
        value: "8080"
      - key: PORT
        value: "8080"
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: openclaw-data
      mountPath: /data
      sizeGB: 1
